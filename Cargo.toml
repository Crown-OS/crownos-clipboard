[package]
name = "crownos-clipboard"
version = "0.1.0"
edition = "2024"
authors = ["Rama Krishnan <ramakrishnan@gmail.com>"]
description = "Windowless clipboard-manager daemon for CrownOS (ext-data-control-v1 client)"

[lib]
name = "crownos_clipboard"
path = "src/lib.rs"

[[bin]]
name = "crownos-clipboard"
path = "src/main.rs"
required-features = ["daemon"]

[features]
default = ["daemon"]
daemon = [
  "crownos-ipc/calloop",
  "dep:crownos-config",
  "dep:wayland-client",
  "dep:wayland-protocols",
  "dep:calloop",
  "dep:calloop-wayland-source",
  "dep:rustix",
  "dep:log",
  "dep:env_logger",
  "dep:thiserror",
  "dep:anyhow",
]

[dependencies]
crownos-ipc = { path = "../crownos-ipc" }
crownos-config = { path = "../crownos-config", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }

wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
calloop = { version = "0.13", optional = true }
calloop-wayland-source = { version = "0.3", optional = true }
rustix = { version = "1", default-features = false, features = ["std"], optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
thiserror = { version = "2", optional = true }
anyhow = { version = "1.0", optional = true }

[dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
